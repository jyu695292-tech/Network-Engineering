sysname FW-01

# Routed data-plane transit toward the two core switches.
interface GigabitEthernet1/0/0
 ip address 192.168.101.1 255.255.255.252
 quit
interface GigabitEthernet1/0/1
 ip address 192.168.101.5 255.255.255.252
 quit

# DMZ gateway. Attach only to the isolated DMZ server segment.
interface GigabitEthernet1/0/2
 ip address 192.168.88.1 255.255.255.0
 quit

# ISP-facing interface: replace with assigned ISP address/mask/gateway.
interface GigabitEthernet1/0/3
 # <ISP_ADDRESS> <ISP_MASK> - obtain from the campus/ISP change record.
 quit

# In-band management interface on VLAN999, same routing table as the data plane.
# Restrict SSH/HTTPS/SNMP source to approved NMS addresses with the actual model's ACL.
interface GigabitEthernet1/0/4
 ip address 192.168.99.240 255.255.255.0
 quit

firewall zone trust
 add interface GigabitEthernet1/0/0
 add interface GigabitEthernet1/0/1
 add interface GigabitEthernet1/0/4
firewall zone dmz
 add interface GigabitEthernet1/0/2
firewall zone untrust
 add interface GigabitEthernet1/0/3

# Return routes to campus networks. Configure primary/standby tracking or ECMP
# only after validating exact USG syntax and behavior; do not install untracked duplicates.
# 10.10.0.0/16, 10.20.0.0/16, 10.30.0.0/16, 10.40.0.0/16 -> Core-A 192.168.101.2; backup Core-B 192.168.101.6
# 192.168.64.0/19 AP management -> Core-A .2; backup Core-B .6
# 192.168.96.0/24 internal services -> Core-A .2; backup Core-B .6
# VLAN999 192.168.99.0/24 is directly connected on the in-band management interface.
# Approved remote NMS prefixes may use a more-specific route via 192.168.99.254; retain ISP default on Untrust.
# VLAN888 DMZ 192.168.88.0/24 is directly connected on the DMZ interface.

# Default route must use the ISP-assigned next hop; no documentation/example public IP is pre-filled.
# Policy baseline: implicit/default deny. Add specific rules after reviewing service matrix.
# Permit approved student VLANs -> Untrust with NAT; deny management/DMZ -> Untrust unless approved.
# Permit only required AC/AP -> Portal/RADIUS/DNS/NTP/Log flows, with exact source/destination/services.
# RADIUS shared secret and portal credentials are managed outside this repository.
